# 宝塔：用「会解析到本机」的域名建站（不要用 3d.com，那是别人的官网）
# 网站设置 → 反向代理，或把这段放进站点扩展配置（如 extension/3d.com/01-reverse-proxy.conf）
# 目标：http://127.0.0.1:8765
# 商城售卖设置填 https://你的域名 ，不要填公网IP:8765

# 静态大文件与前端依赖直接由 Nginx 托管 + gzip + 强缓存，不走 Python SimpleHTTP
location ^~ /output/cache/ {
    alias /www/wwwroot/3d.com/clothing-3d-demo/output/cache/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    gzip on;
    gzip_min_length 1024;
    gzip_types model/gltf-binary application/octet-stream application/json;
    access_log off;
}

location ^~ /output/jobs/ {
    alias /www/wwwroot/3d.com/clothing-3d-demo/output/jobs/;
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header Access-Control-Allow-Origin "*";
    gzip on;
    gzip_min_length 1024;
    gzip_types model/gltf-binary application/octet-stream application/json;
    access_log off;
}

location ^~ /vendor/ {
    alias /www/wwwroot/3d.com/clothing-3d-demo/vendor/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/wasm;
    access_log off;
}

location ^~ /assets/ {
    alias /www/wwwroot/3d.com/clothing-3d-demo/assets/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header Access-Control-Allow-Origin "*";
    gzip on;
    gzip_min_length 1024;
    gzip_types model/gltf-binary image/svg+xml;
    access_log off;
}

# ^~ prevents the site's generic CSS/JS/image locations from bypassing the app.
location ^~ / {
    proxy_pass http://127.0.0.1:8765;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_connect_timeout 10s;
    client_max_body_size 80m;
}
